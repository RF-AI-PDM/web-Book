name: Verify reader
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/create-ci-config.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm dlx firebase-tools@15.32.1 emulators:exec --only firestore,storage --project demo-f15 "node --test tests/security/firebase.rules.test.mjs"
