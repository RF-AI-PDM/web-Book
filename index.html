<!doctype html>
<html lang="en">
  <head>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('f15_theme') || 'dark';
          const lightThemes = ['light', 'sepia', 'cream'];
          const mode = lightThemes.includes(theme) ? 'light' : 'dark';
          document.documentElement.dataset.appTheme = mode;
          document.documentElement.classList.add(`theme-${theme}`);
          document.documentElement.style.colorScheme = mode;
        } catch {
          document.documentElement.dataset.appTheme = 'dark';
          document.documentElement.classList.add('theme-dark');
        }
      })();
    </script>
